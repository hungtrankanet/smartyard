services:
  smartyard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartyard
    ports:
      - "3270:80"
    volumes:
      - .:/var/www/html
      - media_uploads:/var/www/html/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - CI_ENVIRONMENT=production
      - app.baseURL=http://127.0.0.1:3270/
      - MEDIA_STORAGE_DRIVER=local
      - database.default.hostname=host.docker.internal
      - database.default.database=smartyard
      - database.default.username=smartyard_admin
      - database.default.password=RTziYhM8Rwi5fMra
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  media_uploads:
    driver: local
