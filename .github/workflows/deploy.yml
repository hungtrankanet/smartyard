name: CI/CD Pipeline & Deploy to VPS - TOP BEST GLOBAL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-gatekeeper:
    name: Code Quality & 500-Line Gatekeeper Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, curl, json, gd, xml
          coverage: none

      - name: Validate PHP Syntax Across All Modules
        run: |
          echo "==> Running PHP Syntax Lint across all app and test files..."
          find app/Config app/Controllers app/Models app/Services app/Libraries app/Database tests -name "*.php" -exec php -l {} +

      - name: Run <= 500 Lines Per File Gatekeeper Rule
        run: |
          echo "==> Executing Gatekeeper 500-line compliance audit..."
          php tests/gatekeeper_500_lines.php

      - name: Run M2 Infrastructure & Schema Verification Tests
        run: |
          echo "==> Running automated verification test suites..."
          if [ -f "tests/test_m2_infra.php" ]; then
            php tests/test_m2_infra.php
          fi

  deploy:
    name: Auto Deploy to Production VPS
    needs: lint-and-gatekeeper
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check Server Secrets Configured
        id: check_secrets
        run: |
          HOST="${{ secrets.SERVER_HOST || secrets.VPS_HOST }}"
          if [ -z "$HOST" ]; then
            echo "::warning title=Missing Server Host::Secrets not configured. Skipping remote SSH deploy."
            exit 0
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.SERVER_TARGET_DIR || secrets.VPS_TARGET_DIR || '/var/www/topbestglobal' }}"
            echo "==> Deploying TOP BEST GLOBAL to: $TARGET_DIR"

            if [ ! -d "$TARGET_DIR" ]; then
              mkdir -p "$(dirname "$TARGET_DIR")"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            git fetch --all
            git reset --hard origin/main

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            chmod -R 777 writable uploads 2>/dev/null || true

            docker compose down 2>/dev/null || true
            docker compose up -d --build

            echo "==> Container Status on Port 3210:"
            docker compose ps
            echo "==> TOP BEST GLOBAL Deployment Finished Successfully!"
